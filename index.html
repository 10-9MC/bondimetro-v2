<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bondímetro v2</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bondímetro 2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="icon" href="icon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root{
  --bg:#ffffff;--fg:#111827;--mut:#6b7280;--line:#e5e7eb;--card:#f9fafb;
  --acc:#0f766e;--acc2:#14b8a6;--live:#16a34a;--late:#dc2626;--early:#2563eb;--warn:#d97706;
  --sheet-shadow:0 -6px 24px rgba(0,0,0,.18);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111418;--fg:#e5e7eb;--mut:#9ca3af;--line:#262b33;--card:#181c22;
  --acc:#2dd4bf;--acc2:#14b8a6;--live:#4ade80;--late:#f87171;--early:#60a5fa;--warn:#fbbf24;
  --sheet-shadow:0 -6px 24px rgba(0,0,0,.6);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
#map{position:fixed;inset:0;z-index:0;background:#d4dadc}
@media (prefers-color-scheme:dark){#map{background:#1b1f24}}

/* barra superior */
#top{position:fixed;left:0;right:0;top:0;z-index:600;padding:calc(var(--st) + 10px) 10px 0;display:flex;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
#searchBox{flex:1;position:relative}
#q{height:46px;border-radius:23px;padding:0 16px 0 42px;background:var(--bg);border:0;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#searchBox svg{position:absolute;left:14px;top:13px;opacity:.55}
.fab{width:46px;height:46px;border-radius:23px;background:var(--bg);box-shadow:0 2px 10px rgba(0,0,0,.2);display:grid;place-items:center;flex:none}
.fab.on{color:var(--acc)}
#results{position:absolute;top:52px;left:0;right:0;background:var(--bg);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-height:55vh;overflow:auto;display:none}
#results.show{display:block}
#results .ri{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
#results .ri:last-child{border-bottom:0}

/* hoja inferior */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:700;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:var(--sheet-shadow);
  display:flex;flex-direction:column;transition:height .22s ease;height:42vh;padding-bottom:var(--sb)}
#sheet.min{height:calc(96px + var(--sb))}
#sheet.max{height:calc(100vh - var(--st) - 70px)}
#grab{padding:8px 0 4px;display:grid;place-items:center;flex:none}
#grab i{display:block;width:40px;height:5px;border-radius:3px;background:var(--line)}
#head{padding:2px 16px 8px;flex:none;display:flex;align-items:center;gap:10px;min-height:40px}
#head h2{margin:0;font-size:18px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#head .sub{font-size:12.5px;color:var(--mut);font-weight:400}
#body{overflow:auto;flex:1;padding:0 12px 14px;-webkit-overflow-scrolling:touch}
.iconbtn{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;flex:none}
.iconbtn:active{background:var(--card)}
.star.on{color:#f59e0b}

.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 4px 6px;font-weight:600}
.item{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;padding:0 7px;border-radius:7px;
  font-weight:700;font-size:13.5px;color:#fff;background:#475569;flex:none;letter-spacing:-.01em}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.badges .badge{min-width:26px;height:20px;font-size:11.5px;padding:0 5px;border-radius:5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.chip.on{color:#062a26}}
.chips{display:flex;gap:6px;overflow:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

.arr{display:flex;align-items:center;gap:10px;padding:11px 6px;border-bottom:1px solid var(--line)}
.arr .mid{flex:1;min-width:0}
.arr .hs{font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arr .meta{font-size:12.5px;color:var(--mut);margin-top:1px}
.arr .eta{text-align:right;flex:none;min-width:58px}
.arr .eta b{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.arr .eta small{display:block;font-size:11.5px;color:var(--mut);margin-top:-3px}
.arr.sel,.rbus.sel{background:var(--card);border-radius:10px}
.chip.train{background:#7c3aed;border-color:#7c3aed;color:#fff;font-weight:600}
.trainrow{margin-top:6px}
.selbus{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;margin:0 2px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:13px}
#trainBar{display:none;position:fixed;left:10px;right:10px;top:calc(var(--st) + 62px);z-index:750;background:#4c1d95;color:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:13px;align-items:center;gap:8px;flex-wrap:wrap}
#trainBar.show{display:flex}
#trainBar .tt{flex:1 1 160px;min-width:0}
#trainBar button{color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:14px;padding:4px 10px;font-size:12.5px;background:transparent}
.tstat{font-size:12.5px;line-height:1.5}
.live{color:var(--live);font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--live);margin-right:4px;vertical-align:1px;}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 1.6s infinite}}
@keyframes pulse{50%{opacity:.25}}
.sched{color:var(--mut)}
.late{color:var(--late)}.early{color:var(--early)}.stale{color:var(--warn)}
.eta .sched-n{color:var(--mut)}

.note{padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:13.5px;margin:8px 0}
.note.err{border-color:var(--late);color:var(--fg)}
.note b{color:var(--fg)}
.alert{padding:10px 12px;border-radius:12px;background:rgba(217,119,6,.12);border:1px solid var(--warn);font-size:13.5px;margin:6px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.btn{color:#062a26}}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}
.muted{color:var(--mut)}
.small{font-size:12.5px}
label.f{display:block;margin:12px 2px 4px;font-size:13px;color:var(--mut)}

/* recorrido */
.rstop{display:flex;gap:10px;align-items:stretch;min-height:40px}
.rstop .rail{width:22px;flex:none;position:relative}
.rstop .rail:before{content:"";position:absolute;left:10px;top:0;bottom:0;width:3px;background:var(--rc,#64748b);opacity:.55}
.rstop .rail i{position:absolute;left:5px;top:13px;width:13px;height:13px;border-radius:7px;background:var(--bg);border:3px solid var(--rc,#64748b)}
.rstop.first .rail:before{top:16px}.rstop.last .rail:before{bottom:calc(100% - 16px)}
.rstop .nm{padding:10px 0;flex:1;border-bottom:1px solid var(--line);min-width:0}
.rbus{display:flex;gap:10px;align-items:center;min-height:34px}
.rbus .rail{width:22px;flex:none;position:relative;align-self:stretch}
.rbus .rail:before{content:"";position:absolute;left:10px;top:0;bottom:0;width:3px;background:var(--rc,#64748b);opacity:.55}
.rbus .bus{position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:25px;height:25px;border-radius:13px;background:var(--rc,#475569);display:grid;place-items:center;color:#fff;box-shadow:0 0 0 3px var(--bg)}
.rbus .txt{font-size:12.5px;color:var(--fg);padding:6px 0}

/* marcadores */
.busmk{width:30px;height:30px;position:relative}
.busmk .c{position:absolute;inset:3px;border-radius:12px;background:var(--mc,#0f766e);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:grid;place-items:center;color:#fff;font:700 10px/1 sans-serif}
.busmk .a{position:absolute;inset:0;transform-origin:50% 50%}
.busmk .a:before{content:"";position:absolute;left:50%;top:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:7px solid var(--mc,#0f766e)}
.busmk.old .c{opacity:.55}
.memk{width:18px;height:18px;border-radius:9px;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.25)}
.leaflet-control-attribution{font-size:10px!important}
.darktiles{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.6)}
.leaflet-bottom{bottom:calc(42vh)}
.hidden{display:none!important}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 66px);z-index:900;background:#111827;color:#fff;padding:9px 14px;border-radius:12px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:.95}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;vertical-align:-2px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.upd{font-size:11.5px;color:var(--mut);text-align:center;margin:10px 0 2px}

/* ---- v2 ---- */
.busmk{transition:opacity .3s}
.busmk.est .c{opacity:.62;border-style:dashed}
.busmk.est .a{opacity:.5}
.busmk.stop .a{display:none}
.stalebar{padding:8px 12px;border-radius:12px;background:rgba(217,119,6,.12);border:1px solid var(--warn);font-size:13px;margin:6px 0}
.hint{font-size:12px;color:var(--warn);margin:4px 2px 0;min-height:1em}
.ver{font-size:11px;font-weight:700;background:var(--acc);color:#fff;border-radius:6px;padding:1px 5px;vertical-align:2px;margin-left:4px}
@media (prefers-color-scheme:dark){.ver{color:#062a26}}
.gridlink{display:inline-block;margin-top:6px}
.chk{display:flex;gap:8px;align-items:center;margin:12px 2px 0;font-size:14px}
.chk input{width:auto}
[role="button"]{cursor:pointer}
[role="button"]:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
@media (prefers-reduced-motion:reduce){
  .dot,.spin{animation:none}
  #sheet,#toast,.busmk{transition:none}
}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Mapa"></div>

<div id="top">
  <div id="searchBox">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Línea o código de parada" aria-label="Buscar línea o parada" autocomplete="off" enterkeyhint="search">
    <div id="results" role="listbox" aria-label="Resultados"></div>
  </div>
  <button class="fab" id="btnLoc" title="Mi ubicación" aria-label="Mi ubicación">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
  <button class="fab" id="btnMenu" title="Ciudades y ajustes" aria-label="Menú">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</div>

<div id="sheet">
  <div id="grab" role="button" tabindex="0" aria-label="Agrandar o achicar el panel"><i></i></div>
  <div id="head"></div>
  <div id="body"></div>
</div>
<div id="trainBar" role="status" aria-live="polite"><span class="tt"></span><button data-act="trainView">Ver</button><button data-act="trainEnd">Terminar</button><button data-act="trainDiscard" aria-label="Cancelar y descartar la sesión">Cancelar</button></div>
<div id="hostNote" style="position:fixed;left:8px;right:8px;bottom:8px;z-index:9998;background:#1a2332;color:#cde;font:12px/1.35 system-ui,sans-serif;padding:8px 10px;border-radius:10px;box-shadow:0 4px 16px #0006" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/leaflet.js"></script>
<script>
"use strict";
/* ================================================================
   Bondímetro v2 — cliente OneBusAway para el backend de Cuándo SUBO
   Cambios vs v1: ver README.md / CHANGELOG.md.
   ================================================================ */
const APP_VER = "2.1.0";
const NS = "bondi2.";   // prefijo de localStorage (v1 usa "bondi." en el mismo origen: no pisarlo)

const DEFAULTS = {
  base: "https://cuandosubo.sube.gob.ar/onebusaway-api-webapp/api/where",
  key: "CuandoSUBO-Android-9b8a8543-b111-4caf-80b0-b70913425a0c",
  mode: "auto",                 // auto | fetch | proxy | jsonp
  proxy: "",                   // en GitHub Pages no hay proxy Daqui; auto usa fetch→JSONP
  refresh: 20,                  // s entre consultas en la vista de parada (configurable, sin mínimo duro)
  routeRefresh: 15,             // s entre consultas en la vista de línea (configurable)
  interp: true,                 // mover los bondis entre consultas (extrapolación)
  useModel: true,               // usar lo aprendido con "Estoy en este bondi" (velocidad por tramo + desfase del feed)
  grid: "/bondi/"               // web con la grilla oficial de Mi Bus (sin datos en vivo)
};
// Autenticación: UN solo formato. Verificado el 30/10/2026 con 2 pedidos reales
// (current-time y agencies-with-coverage → HTTP 200, code 200):
//   Authorization: apiKey <clave>   (+ ?key=<clave> en la URL, como OneBusAway estándar)
const AUTH_SCHEME = "apiKey";
const FALLBACK_CENTER = [-41.1335, -71.3103]; // Centro Cívico, Bariloche
const EXTRAP_MAX_S = 30;      // tope de extrapolación desde el último fix GPS
const ANIM_MS = 1000;         // animación al llegar un fix nuevo
const MAX_SPEED = 22;         // m/s (~80 km/h): tope para la extrapolación
const REDUCE_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;

const CITIES = [
 ["AMBA",-34.6037,-58.3816],["La Plata",-34.9214,-57.9544],["Bariloche",-41.1335,-71.3103],["Neuquén",-38.9516,-68.0591],
 ["Cipolletti",-38.9339,-67.9903],["General Roca",-39.0333,-67.5833],["Viedma",-40.8135,-62.9967],["Mendoza",-32.8895,-68.8458],
 ["San Juan",-31.5375,-68.5364],["San Luis",-33.3017,-66.3378],["Córdoba",-31.4201,-64.1888],["Río Cuarto",-33.1232,-64.3493],
 ["Villa María",-32.4075,-63.2402],["Rosario",-32.9442,-60.6505],["Santa Fe",-31.6333,-60.7000],["Paraná",-31.7319,-60.5238],
 ["Tucumán",-26.8083,-65.2176],["Salta",-24.7821,-65.4232],["Jujuy",-24.1858,-65.2995],["Catamarca",-28.4696,-65.7852],
 ["La Rioja",-29.4131,-66.8558],["Santiago del Estero",-27.7951,-64.2615],["Resistencia",-27.4514,-58.9867],["Corrientes",-27.4692,-58.8306],
 ["Posadas",-27.3671,-55.8961],["Formosa",-26.1775,-58.1781],["Mar del Plata",-38.0055,-57.5426],["Bahía Blanca",-38.7196,-62.2724],
 ["Tandil",-37.3217,-59.1332],["Olavarría",-36.8927,-60.3225],["Junín",-34.5850,-60.9589],["Pergamino",-33.8895,-60.5736],
 ["San Nicolás",-33.3342,-60.2108],["Zárate",-34.0981,-59.0286],["Luján",-34.5703,-59.1050],["Santa Rosa",-36.6167,-64.2833],
 ["Comodoro Rivadavia",-45.8641,-67.4966],["Trelew",-43.2489,-65.3051],["Puerto Madryn",-42.7692,-65.0385],["Rawson",-43.3002,-65.1023],
 ["Esquel",-42.9110,-71.3195],["Río Gallegos",-51.6230,-69.2168],["Ushuaia",-54.8019,-68.3030],["Río Grande",-53.7877,-67.7095],
 ["San Martín de los Andes",-40.1579,-71.3534],["Concordia",-31.3929,-58.0209],["Gualeguaychú",-33.0094,-58.5172],["Campana",-34.1633,-58.9592]
];

/* ---------------------------- estado ---------------------------- */
function ls(k, v) {
  try { if (v === undefined) return JSON.parse(localStorage.getItem(NS + k)); localStorage.setItem(NS + k, JSON.stringify(v)); }
  catch (e) { return null; }
}
// Primera vez: traer favoritos y la vista de v1 (solo lectura de sus claves).
(function migrateFromV1() {
  if (ls("migrated")) return;
  try {
    const f = JSON.parse(localStorage.getItem("bondi.favs") || "null"); if (f) ls("favs", f);
    const v = JSON.parse(localStorage.getItem("bondi.view") || "null"); if (v) ls("view", v);
  } catch (e) {}
  ls("migrated", true);
})();

const URL_OVERRIDES = {};
function loadSettings() {
  const st = Object.assign({}, DEFAULTS, ls("settings") || {});
  delete st.auth;
  // Overrides por URL (pruebas/dev): ?api=...&key=...&mode=...&proxy=...  Se usan en esta sesión
  // y NO se guardan, salvo que toques "Guardar" en Ajustes. Ver riesgo en README.
  const p = new URLSearchParams(location.search);
  for (const [q, k] of [["api", "base"], ["key", "key"], ["mode", "mode"], ["proxy", "proxy"]]) if (p.get(q)) { st[k] = p.get(q); URL_OVERRIDES[k] = st[k]; }
  return st;
}
const S = {
  settings: loadSettings(),
  transport: null,
  skew: 0, clockBad: false,
  here: null, watchId: null, gpsWanted: false,
  agencies: [], agencyName: {}, routes: {}, routesByAgency: {}, stopsCache: {},
  routePolys: {}, polyLoading: new Set(),
  stopFilter: null, selTrip: null, view: null,
  arrivals: [], situations: [], routeData: null, routeDir: 0, vehicles: [],
  lastOk: 0, connErr: null,
  favs: Object.assign({ stops: [], routes: [] }, ls("favs") || {})
};
S.transport = (ls("transport") || {})[S.settings.base] || null;
function saveFavs() { ls("favs", S.favs); }

/* ------------------------- utilidades ---------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const now = () => Date.now() + S.skew;
const r3 = x => (+x).toFixed(3);   // ~100 m: precisión de la ubicación que mandamos al servidor
function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms); }
function dist(a, b) {
  const R = 6371000, r = Math.PI / 180, dLa = (b[0] - a[0]) * r, dLo = (b[1] - a[1]) * r;
  const x = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function fmtDist(m) { return m < 1000 ? Math.max(0, Math.round(m / 10) * 10) + " m" : (m / 1000).toFixed(1).replace(".", ",") + " km"; }
function fmtAgo(ms) { const s = Math.max(0, Math.round(ms / 1000)); if (s < 60) return s + " s"; const m = Math.round(s / 60); return m < 60 ? m + " min" : Math.round(m / 60) + " h"; }

/* ------------------------- reloj de 1 s -------------------------- */
// Avanza cuentas regresivas, "GPS hace X", distancias estimadas y el estado de la conexión entre consultas.
// La hora de llegada es siempre la que informa el servidor (predictedArrivalTime); acá solo se descuenta.

  const s = (t - now()) / 1000;

  if (s < 180) { const r = Math.round(s / 5) * 5; const txt = Math.floor(r / 60) + ":" + String(r % 60).padStart(2, "0"); return [txt, "min", "llega en " + txt + " minutos"]; }
  const m = Math.round(s / 60);
  return m > 99 ? [hhmm(t), "", "llega a las " + hhmm(t)] : [String(m), "min", "llega en " + m + " minutos"];
}

  for (const el of document.querySelectorAll("[data-t]")) {

    if (el.parentElement) el.parentElement.setAttribute("aria-label", aria);

  }

    const tr = Track.get(el.dataset.trip), mv = tr && tr.last ? tr.last.moved : 0;

    else if (S.connErr) u.textContent = (S.lastOk ? "⚠️ Sin conexión · último dato hace " + fmtAgo(Date.now() - S.lastOk) : "⚠️ Sin conexión · sin datos") + (P.next ? " · reintento en " + fmtAgo(P.next - Date.now()) : "");

    else u.textContent = "";

  if (REDUCE_MOTION && Track.size) updateMarkers(performance.now());
  if (TR.session) renderTrainBar();
}

  const r = S.routes[d.id] || { id: d.id }, col = routeColor(r), g = d.groups[S.routeDir];

  if (d.groups.length > 1) html += `<div class="chips">${d.groups.map((x, i) => `<button class="chip ${i === S.routeDir ? "on" : ""}" ${actAttr("dir", i)}>${esc(x.name ? "Hacia " + x.name.replace(/^hacia\s+/i, "") : "Sentido " + (i + 1))}</button>`).join("")}</div>`;
  const mine = vehicles.filter(v => vehInGroup(v, g));
  html += `<div class="chips" id="scopeChips"><button class="chip ${S.routeAll ? "on" : ""}" ${actAttr("scope", "all")} aria-pressed="${!!S.routeAll}">Todas las unidades (${vehicles.length})</button><button class="chip ${S.routeAll ? "" : "on"}" ${actAttr("scope", "dir")} aria-pressed="${!S.routeAll}">Solo este sentido (${mine.length})</button><button class="chip" ${actAttr("fitBuses")}>🔍 Encuadrar bondis</button></div>`;
  html += `<div class="small muted" id="routeSummary" style="margin:2px 4px 8px">${vehicles.length
    ? `<span class="${stale ? "stale" : "live"}">${stale ? "⚠️ último dato (sin conexión)" : '<span class="dot"></span>en vivo'}</span> · ${vehicles.length} en circulación en la línea, ${mine.length} en este sentido${S.routeAll && vehicles.length > mine.length ? " (las del otro sentido, más claras)" : ""}`
    : (S.lastOk ? `Sin bondis con GPS en esta línea ahora. ${gridLink()}` : "Buscando unidades…")}</div>`;
  const sel = S.selTrip && vehicles.find(v => v.tripId === S.selTrip);
  if (sel) {
    const training = TR.session && TR.session.tripId === sel.tripId;
    html += `<div class="selbus" id="selBus">${badge(r)}<span>${esc(sel.trip.tripHeadsign || "")}${sel.st.vehicleId ? " · interno " + esc(String(sel.st.vehicleId).split("_").pop()) : ""}${vehInGroup(sel, g) ? "" : " · otro sentido"}</span>` +
      (training ? `<b>🎓 Entrenando con este bondi</b>` : `<button class="chip train" data-act="trainStart" data-arg="${esc(sel.tripId)}" data-route="${esc(d.id)}" aria-label="Estoy en este bondi: entrenar el interpolado con el GPS del celu">🚌 Estoy en este bondi</button>`) + `</div>`;
  } else if (vehicles.length && !TR.session) html += `<div class="small muted" style="margin:0 4px 8px">¿Vas arriba de uno? Tocalo en el mapa o en la lista y elegí “🚌 Estoy en este bondi” para entrenar el interpolado.</div>`;
  const byNext = {};

        <div class="txt">${esc(v.trip.tripHeadsign || "")}${dev ? ` · <span class="${dev > 0 ? "late" : "early"}">${Math.abs(dev)} min ${dev > 0 ? "tarde" : "antes"}</span>` : ""}${loc ? ` · <span class="muted" data-loc="${loc}">GPS hace ${fmtAgo(now() - loc)}</span>` : ""}</div></div>`;
    }

    html += `<div class="rstop ${i === 0 ? "first" : ""} ${i === g.stopIds.length - 1 ? "last" : ""}" style="--rc:${col}" ${goAttr("#/stop/" + encodeURIComponent(sid))}><div class="rail"><i></i></div><div class="nm">${esc(s.name)}${s.code ? ` <span class="muted small">${esc(s.code)}</span>` : ""}</div></div>`;
  });

}
// TODAS las unidades de la línea en el mapa (las del otro sentido, semitransparentes), con marcadores reusados.
function drawVehicles() {
  const d = S.routeData; if (!d) return;
  const r = S.routes[d.id] || { id: d.id }, g = d.groups[S.routeDir], stale = isStale(), items = [];
  for (const v of S.vehicles || []) {

    const loc = locTime(v.st);

}

/* ---- búsqueda ---- */
let searchSeq = 0;
const q = $("#q"), results = $("#results");
q.addEventListener("input", () => { clearTimeout(q._t); q._t = setTimeout(doSearch, 250); });
q.addEventListener("focus", () => { ensureRoutes(); if (q.value.trim()) doSearch(); });
q.addEventListener("keydown", e => { if (e.key === "Enter") { const f = results.querySelector(".ri[data-go]"); if (f) f.click(); } if (e.key === "Escape") closeSearch(); });
document.addEventListener("click", e => { if (!$("#searchBox").contains(e.target)) results.classList.remove("show"); });
function closeSearch() { results.classList.remove("show"); q.blur(); }
function nearAgencies(maxKm = 60, maxN = 25) {
  const c = [map.getCenter().lat, map.getCenter().lng];
  return S.agencies.map(a => ({ a, d: dist(c, [a.lat, a.lon]) })).filter(x => x.d < maxKm * 1000 + Math.max(x.a.latSpan || 0, x.a.lonSpan || 0) * 55000).sort((x, y) => x.d - y.d).slice(0, maxN).map(x => x.a);
}
async function ensureRoutes() {
  const todo = nearAgencies().filter(a => !S.routesByAgency[a.id]);
  for (let i = 0; i < todo.length; i += 4) {
    await Promise.all(todo.slice(i, i + 4).map(async a => {
      const cached = ls("routes." + a.id);
      if (cached && Date.now() - cached.at < 3 * 864e5) { S.routesByAgency[a.id] = cached.list; cached.list.forEach(r => S.routes[r.id] = S.routes[r.id] || r); return; }
      try {
        const r = await api("routes-for-agency/" + encodeURIComponent(a.id));
        const lst = (r.data.list || []).map(x => ({ id: x.id, shortName: x.shortName, longName: x.longName, description: x.description, color: x.color, textColor: x.textColor, agencyId: x.agencyId || a.id }));
        S.routesByAgency[a.id] = lst; lst.forEach(x => S.routes[x.id] = S.routes[x.id] || x);
        ls("routes." + a.id, { at: Date.now(), list: lst });
      } catch (e) { S.routesByAgency[a.id] = []; }
    }));
  }
}
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const routeRow = r => `<div class="ri" ${goAttr("#/route/" + encodeURIComponent(r.id))} data-close="1">${badge(r)}<div class="mid"><div class="t">${esc(r.longName || r.description || "Línea " + routeLabel(r))}</div><div class="s">${esc(S.agencyName[r.agencyId] || "")} · ver todos los bondis</div></div></div>`;
async function doSearch() {
  const text = q.value.trim(), my = ++searchSeq;
  if (!text) { results.classList.remove("show"); return; }
  const n = norm(text), near = new Set(nearAgencies().map(a => a.id));
  const pool = Object.values(S.routes).filter(r => !r.agencyId || near.size === 0 || near.has(r.agencyId));
  const score = r => { const sn = norm(r.shortName), ln = norm(r.longName) + " " + norm(r.description); return sn === n ? 0 : sn.startsWith(n) ? 1 : sn.includes(n) ? 2 : ln.includes(n) ? 3 : 9; };
  const hits = pool.map(r => [score(r), r]).filter(x => x[0] < 9).sort((a, b) => a[0] - b[0] || String(a[1].shortName).localeCompare(String(b[1].shortName), "es", { numeric: true })).slice(0, 25).map(x => x[1]);
  let html = hits.map(routeRow).join("");
  results.innerHTML = html || `<div class="ri muted"><span class="spin"></span> Buscando…</div>`;
  results.classList.add("show");
  const c = map.getCenter();
  try {
    const [rr, ss] = await Promise.all([
      api("routes-for-location", { lat: r3(c.lat), lon: r3(c.lng), radius: 30000, query: text }).catch(() => null),
      /^\d{2,}$/.test(text) ? api("stops-for-location", { lat: r3(c.lat), lon: r3(c.lng), radius: 30000, query: text }).catch(() => null) : null
    ]);
    if (my !== searchSeq) return;
    if (rr) { indexRefs(rr.data.references); for (const r of rr.data.list || []) { S.routes[r.id] = r; if (!hits.some(h => h.id === r.id)) hits.push(r); } }
    let extra = "";
    if (ss) { indexRefs(ss.data.references); for (const s of (ss.data.list || []).slice(0, 8)) { S.stopsCache[s.id] = s; extra += `<div class="ri" ${goAttr("#/stop/" + encodeURIComponent(s.id))} data-close="1"><span class="badge" style="background:#0f766e">P</span><div class="mid"><div class="t">${esc(s.name)}</div><div class="s">Parada ${esc(s.code || s.id)}</div></div></div>`; } }
    html = hits.slice(0, 25).map(routeRow).join("") + extra;
    results.innerHTML = html || `<div class="ri muted">Nada con «${esc(text)}» cerca de esta zona.</div>`;
  } catch (e) { if (!html) results.innerHTML = `<div class="ri">${errMsg(e)}</div>`; }
}

/* ---- ciudades con cobertura ---- */
$("#btnMenu").onclick = () => go(location.hash === "#/cities" ? "#/" : "#/cities");
async function loadAgencies() {
  const cached = ls("agencies");
  if (cached && Date.now() - cached.at < 864e5) { S.agencies = cached.list; cached.list.forEach(a => S.agencyName[a.id] = a.name); return true; }
  try {
    const r = await api("agencies-with-coverage");
    indexRefs(r.data.references);
    S.agencies = (r.data.list || []).map(x => ({ id: x.agencyId, name: S.agencyName[x.agencyId] || x.agencyId, lat: x.lat, lon: x.lon, latSpan: x.latSpan, lonSpan: x.lonSpan }));
    ls("agencies", { at: Date.now(), list: S.agencies });
    return true;
  } catch (e) { return !!S.agencies.length; }
}
function clusters() {
  const out = [];
  for (const a of S.agencies) {
    if (!Number.isFinite(a.lat)) continue;
    const name = cityName(a.lat, a.lon) || `Zona ${a.lat.toFixed(2)}, ${a.lon.toFixed(2)}`;
    let c = out.find(x => x.name === name);
    if (!c) out.push(c = { name, pts: [], ags: [] });
    c.pts.push([a.lat, a.lon]); c.ags.push(a.name);
  }
  return out.sort((a, b) => b.ags.length - a.ags.length || a.name.localeCompare(b.name, "es"));
}
const gearSvg = `<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>`;
async function openCities() {
  S.view = { type: "cities" };
  setSheet("max");

    <button class="iconbtn" data-go="#/settings" aria-label="Ajustes">${gearSvg}</button>`);

  const cl = S.clusters = clusters();
  body(`<div class="small muted" style="margin:4px 4px 8px">${S.agencies.length} empresas con datos en ${cl.length} zonas. Tocá una para ir.</div>` +
    cl.map((c, i) => `<div class="item" role="button" tabindex="0" ${actAttr("cluster", i)}><div class="mid"><div class="t">${esc(c.name)}</div><div class="s">${esc(c.ags.slice(0, 4).join(", "))}${c.ags.length > 4 ? ` y ${c.ags.length - 4} más` : ""}</div></div><span class="muted small">${c.ags.length}</span></div>`).join("") +
    `<div class="row" style="margin-top:14px"><button class="btn ghost" data-go="#/settings">Ajustes de conexión</button></div>`);

/* ---- ajustes y diagnóstico ---- */
function refreshHint(v) {
  v = +v;
  if (!(v > 0)) return "";
  if (v < 10) return `⚠️ ${v} s es muy seguido: el servidor actualiza las posiciones cada ~30 s, así que no vas a ver datos más nuevos, solo más pedidos (y más chance de que bloqueen la clave). Se permite igual.`;
  if (v < 15) return "Ojo: por debajo de ~15 s casi siempre llega el mismo dato. El movimiento fluido lo da la interpolación.";
  return "";
}
function openSettings() {
  S.view = { type: "settings" }; setSheet("max");
  const st = S.settings;
  head(`<button class="iconbtn" ${actAttr("back")} aria-label="Volver">${backSvg}</button><h2>Ajustes <span class="sub">· v${APP_VER}</span></h2>`);
  body(`
    <label class="f" for="sRef">Refresco en la parada (segundos)</label><input id="sRef" type="number" min="1" max="600" step="1" inputmode="numeric" value="${esc(st.refresh)}"><div class="hint" id="hRef"></div>
    <label class="f" for="sRRef">Refresco en la vista de línea (segundos)</label><input id="sRRef" type="number" min="1" max="600" step="1" inputmode="numeric" value="${esc(st.routeRefresh)}"><div class="hint" id="hRRef"></div>

    <div class="small muted" style="margin:2px 2px 0">Estima la posición con la velocidad de los últimos fixes, sobre el recorrido, hasta 30 s. El bondi se ve más claro y con borde punteado cuando la posición es estimada.</div>
    <label class="chk"><input id="sModel" type="checkbox" ${st.useModel !== false ? "checked" : ""}> Usar lo aprendido con “Estoy en este bondi”</label>
    <div class="sec">Entrenamiento del interpolado</div>
    <div class="small muted" style="margin:0 2px 6px">Arriba del bondi, tocá la unidad (en la parada o en el mapa de la línea) y elegí <b>🚌 Estoy en este bondi</b>. La app compara el GPS del celu con el del bondi y aprende la velocidad por tramo y el atraso típico del feed. <b>Todo queda solo en este dispositivo; no se sube a ningún servidor.</b></div>
    <div id="trainStats"></div>
    <div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn ghost" ${actAttr("trainExport")}>Exportar (JSON)</button><button class="btn ghost" ${actAttr("trainClear")}>Borrar lo aprendido</button></div>
    <label class="f" for="sBase">Servidor OneBusAway (API “where”)</label><input id="sBase" value="${esc(st.base)}" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label class="f" for="sKey">Clave de API</label><input id="sKey" value="${esc(st.key)}" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="small muted" style="margin:4px 2px 0">Cabecera que se manda: <span class="mono">Authorization: ${AUTH_SCHEME} …${esc(String(st.key).slice(-12))}</span> (formato fijo, verificado 30/10/2026).</div>
    <label class="f" for="sMode">Modo de conexión</label>
    <select id="sMode">
      <option value="auto">Automático (directo → proxy → JSONP)</option>
      <option value="fetch">Directo (CORS)</option><option value="proxy">Solo proxy</option><option value="jsonp">JSONP (sin cabecera)</option>
    </select>
    <label class="f" for="sProxy">Proxy (si el servidor bloquea al navegador)</label><input id="sProxy" value="${esc(st.proxy)}" placeholder="/bondimetro/proxy" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label class="f" for="sGrid">Web de horarios (grilla Mi Bus, plan B sin datos en vivo)</label><input id="sGrid" value="${esc(st.grid)}" placeholder="/bondi/" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="row" style="margin-top:14px;flex-wrap:wrap">
      <button class="btn" ${actAttr("save")}>Guardar</button>
      <button class="btn ghost" ${actAttr("test")}>Probar conexión</button>
      <button class="btn ghost" ${actAttr("reset")}>Valores de fábrica</button>
    </div>
    <div id="diag" aria-live="polite"></div>
    <div class="note small" style="margin-top:16px">Datos: servidor OneBusAway de Cuándo SUBO (SUBE / Nación Servicios). App personal, sin afiliación oficial. Mapa © OpenStreetMap; alternativa Esri (Powered by Esri).</div>`);
  $("#sMode").value = st.mode; renderTrainStats();
  for (const [i, h] of [["sRef", "hRef"], ["sRRef", "hRRef"]]) { const upd = () => { $("#" + h).textContent = refreshHint($("#" + i).value); }; $("#" + i).addEventListener("input", upd); upd(); }
}
function saveSettings() {
  const st = S.settings;
